<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div>
        <div id="wrapper">
            <div id="header">
                <div id="logo"></div>
                <div id="navbar"></div>
            </div>

            <div id="content">
                <div id="left-panel"></div>

                <div id="right-panel">
                    <!-- top row: big box + 8 pink boxes -->
                    <div class="top-row row">
                        <div id="big-box"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                        <div class="grid top-grid"></div>
                    </div>

                    <!-- bottom row: 12 pink boxes -->
                    <div class="bottom-row row">
                        <div class="grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                        <div class="grid bottom-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
